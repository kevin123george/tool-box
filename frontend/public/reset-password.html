<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolBox — Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { margin: 0; min-height: 100vh; font-size: 14px; }
    .fade-in { animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen bg-base-100 flex items-center justify-center p-6">

  <div class="w-full max-w-sm fade-in">

    <!-- Brand -->
    <div class="flex items-center gap-2 justify-center mb-8">
      <span class="text-3xl">🧰</span>
      <span class="text-xl font-bold tracking-tight">ToolBox</span>
    </div>

    <!-- Validating state -->
    <div id="stateValidating" class="text-center">
      <span class="loading loading-spinner loading-md opacity-40"></span>
      <p class="text-sm opacity-40 mt-3">Validating reset link…</p>
    </div>

    <!-- Invalid / expired -->
    <div id="stateInvalid" class="hidden text-center">
      <div class="text-4xl mb-4">⛔</div>
      <h2 class="text-lg font-bold mb-2">Link invalid or expired</h2>
      <p class="text-sm opacity-50 mb-6">This reset link has already been used or has expired (24h limit). Ask your admin to generate a new one.</p>
      <a href="/login.html" class="btn btn-ghost btn-sm">← Back to Sign In</a>
    </div>

    <!-- Reset form -->
    <div id="stateForm" class="hidden">
      <h2 class="text-xl font-bold mb-1 text-center">Set new password</h2>
      <p id="resetGreeting" class="text-sm opacity-40 text-center mb-6"></p>

      <div class="flex flex-col gap-4">
        <div>
          <label class="label pb-1"><span class="label-text text-xs font-medium uppercase tracking-wide opacity-60">New Password</span></label>
          <label class="input input-bordered flex items-center gap-2 w-full">
            <input id="newPassword" type="password" class="grow" placeholder="Min 6 characters" autocomplete="new-password" />
            <button type="button" onclick="togglePw('newPassword')" class="opacity-40 hover:opacity-100 transition-opacity">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </label>
        </div>
        <div>
          <label class="label pb-1"><span class="label-text text-xs font-medium uppercase tracking-wide opacity-60">Confirm Password</span></label>
          <label class="input input-bordered flex items-center gap-2 w-full">
            <input id="confirmPassword" type="password" class="grow" placeholder="Repeat password" autocomplete="new-password" />
            <button type="button" onclick="togglePw('confirmPassword')" class="opacity-40 hover:opacity-100 transition-opacity">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </label>
        </div>
        <div id="resetError" class="alert alert-error text-sm hidden py-2 px-3"></div>
        <button id="resetBtn" onclick="doReset()" class="btn btn-primary w-full mt-1">Set Password</button>
      </div>
    </div>

    <!-- Success -->
    <div id="stateSuccess" class="hidden text-center">
      <div class="text-4xl mb-4">✅</div>
      <h2 class="text-lg font-bold mb-2">Password updated!</h2>
      <p class="text-sm opacity-50 mb-6">You can now sign in with your new password.</p>
      <a href="/login.html" class="btn btn-primary btn-sm">Go to Sign In</a>
    </div>

  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    function show(stateId) {
      ['stateValidating','stateInvalid','stateForm','stateSuccess'].forEach(id => {
        document.getElementById(id).classList.toggle('hidden', id !== stateId);
      });
    }

    function togglePw(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    async function validate() {
      if (!token) { show('stateInvalid'); return; }
      try {
        const res = await fetch(`/api/auth/reset-password/validate?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok || !data.valid) { show('stateInvalid'); return; }
        document.getElementById('resetGreeting').textContent = `Hi ${data.name} (${data.email})`;
        show('stateForm');
      } catch {
        show('stateInvalid');
      }
    }

    async function doReset() {
      const pw      = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const errEl   = document.getElementById('resetError');
      const btn     = document.getElementById('resetBtn');
      errEl.classList.add('hidden');

      if (pw.length < 6) { errEl.textContent = 'Password must be at least 6 characters'; errEl.classList.remove('hidden'); return; }
      if (pw !== confirm) { errEl.textContent = 'Passwords do not match'; errEl.classList.remove('hidden'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading loading-spinner loading-xs"></span> Saving…';
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pw })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.error || 'Failed to reset password';
          errEl.classList.remove('hidden');
          return;
        }
        show('stateSuccess');
      } catch {
        errEl.textContent = 'Connection error. Try again.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Set Password';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      validate();
      document.getElementById('confirmPassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') doReset();
      });
    });
  </script>
</body>
</html>
