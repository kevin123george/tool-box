<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox — Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toastContainer" class="toast toast-end z-[10000]" role="alert" aria-live="polite"></div>
    <div id="loadingOverlay" class="loading-overlay" role="status" aria-label="Loading">
        <div class="flex flex-col items-center gap-4"><span class="loading loading-spinner loading-lg"></span><span class="text-sm uppercase tracking-widest" id="loadingText">Loading...</span></div>
    </div>
    <div id="nav-placeholder" data-active="notes"></div>

    <!-- Notes three-panel app -->
    <div id="notesApp" class="flex h-[calc(100vh-56px)] -mx-6 -mb-6 overflow-hidden">

        <!-- ===== FOLDER PANEL (left, ~208px) ===== -->
        <div id="folderPanel" class="w-52 shrink-0 border-r border-base-300 flex flex-col overflow-hidden bg-base-100">

            <!-- Header -->
            <div class="flex items-center justify-between px-3 py-2.5 border-b border-base-300 shrink-0">
                <span class="text-xs font-semibold uppercase tracking-widest opacity-50">Notes</span>
                <button
                    class="btn btn-ghost btn-xs btn-square"
                    title="New Folder"
                    onclick="promptNewFolder()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                </button>
            </div>

            <!-- Scrollable folder + tags area -->
            <div class="flex-1 overflow-y-auto overflow-x-hidden py-1">

                <!-- All Notes -->
                <button
                    id="allNotesBtn"
                    class="w-full flex items-center gap-2 px-3 py-1.5 text-sm rounded-none hover:bg-base-200 transition-colors text-left"
                    onclick="selectFolder(null)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 shrink-0 opacity-50">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
                    </svg>
                    <span class="flex-1 truncate">All Notes</span>
                    <span id="allNotesCount" class="text-[10px] opacity-40 font-mono">0</span>
                </button>

                <!-- Folder list -->
                <div id="folderList" class="mt-1">
                    <!-- populated by JS -->
                </div>

                <!-- Tags section -->
                <div class="mt-2 px-3 pb-1">
                    <div class="text-[10px] font-semibold uppercase tracking-widest opacity-35 mb-1.5">Tags</div>
                    <div id="tagList" class="flex flex-wrap gap-1">
                        <!-- populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== NOTE LIST PANEL (middle, ~256px) ===== -->
        <div id="noteListPanel" class="w-64 shrink-0 border-r border-base-300 flex flex-col overflow-hidden bg-base-100">

            <!-- Search + New Note -->
            <div class="px-2 py-2 border-b border-base-300 shrink-0 flex flex-col gap-1.5">
                <div class="relative">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                         class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 opacity-40 pointer-events-none">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
                    </svg>
                    <input
                        id="noteSearchInput"
                        type="text"
                        placeholder="Search notes..."
                        class="input input-sm input-ghost w-full pl-7 border border-base-300 text-xs"
                        oninput="debounceSearch(this.value)">
                </div>
                <button class="btn btn-primary btn-sm w-full gap-1.5 text-xs" onclick="newNote()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                    New Note
                </button>
            </div>

            <!-- Note list -->
            <div id="noteList" class="flex-1 overflow-y-auto">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- ===== EDITOR PANEL (right, flex-1) ===== -->
        <div id="editorPanel" class="flex-1 flex flex-col overflow-hidden bg-base-100">

            <!-- Empty state when no note selected -->
            <div id="editorEmptyState" class="flex-1 flex flex-col items-center justify-center opacity-30">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-16 h-16 mb-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/>
                </svg>
                <p class="text-sm font-medium">Select a note or create a new one</p>
            </div>

            <!-- Editor area (hidden until note selected) -->
            <div id="editorContent" class="hidden flex-1 flex flex-col overflow-hidden">

                <!-- Title input -->
                <div class="px-6 pt-5 pb-2 shrink-0 border-b border-base-300">
                    <input
                        id="noteTitleInput"
                        type="text"
                        placeholder="Untitled"
                        class="w-full bg-transparent border-none outline-none text-2xl font-bold placeholder:opacity-30 focus:outline-none"
                        oninput="scheduleSave()">
                    <!-- Tags row -->
                    <div class="flex items-center gap-1.5 mt-2 flex-wrap" id="noteTagsRow">
                        <!-- tags populated by JS -->
                    </div>
                </div>

                <!-- Toolbar -->
                <div class="flex items-center gap-1 px-4 py-1.5 border-b border-base-300 shrink-0 bg-base-100">
                    <div class="join" role="group">
                        <button id="modeEditBtn"   class="join-item btn btn-xs btn-primary"  onclick="setEditorMode('edit')">Edit</button>
                        <button id="modeSplitBtn"  class="join-item btn btn-xs btn-ghost"   onclick="setEditorMode('split')">Split</button>
                        <button id="modePreviewBtn" class="join-item btn btn-xs btn-ghost"  onclick="setEditorMode('preview')">Preview</button>
                    </div>
                    <div class="flex-1"></div>
                    <span id="wordCountDisplay" class="text-[11px] opacity-40 font-mono"></span>
                    <span id="lastSavedDisplay" class="text-[11px] opacity-40 ml-2"></span>
                    <button
                        class="btn btn-ghost btn-xs ml-1 text-error"
                        title="Delete note"
                        onclick="confirmDeleteNote()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                        </svg>
                    </button>
                </div>

                <!-- Editor + Preview area -->
                <div id="editorBody" class="flex-1 flex overflow-hidden">

                    <!-- EasyMDE container (shown in edit + split) -->
                    <div id="editorMdeWrapper" class="flex-1 overflow-hidden flex flex-col">
                        <textarea id="noteEditorTextarea"></textarea>
                    </div>

                    <!-- Preview pane (shown in split + preview) -->
                    <div id="editorPreviewPane" class="hidden flex-1 overflow-y-auto border-l border-base-300 note-preview prose prose-sm max-w-none">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Folder Modal -->
    <dialog id="newFolderModal" class="modal">
        <div class="modal-box max-w-sm">
            <h3 class="font-bold text-lg mb-4">New Folder</h3>
            <input id="newFolderNameInput" type="text" placeholder="Folder name" class="input input-bordered w-full" onkeydown="if(event.key==='Enter')submitNewFolder()">
            <div class="modal-action mt-4">
                <button class="btn btn-ghost" onclick="document.getElementById('newFolderModal').close()">Cancel</button>
                <button class="btn btn-primary" onclick="submitNewFolder()">Create</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- Add Tag Modal -->
    <dialog id="addTagModal" class="modal">
        <div class="modal-box max-w-sm">
            <h3 class="font-bold text-lg mb-4">Add Tag</h3>
            <input id="addTagInput" type="text" placeholder="Tag name" class="input input-bordered w-full" onkeydown="if(event.key==='Enter')submitAddTag()">
            <div class="modal-action mt-4">
                <button class="btn btn-ghost" onclick="document.getElementById('addTagModal').close()">Cancel</button>
                <button class="btn btn-primary" onclick="submitAddTag()">Add</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js"></script>
    <script src="router.js"></script>
    <script src="notes.js"></script>
</body>
</html>
