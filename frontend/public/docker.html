<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Docker Services</title>
</head>
<body>
<div class="p-4 max-w-6xl mx-auto">

    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <h1 class="text-2xl font-bold">Docker Services</h1>
        <div class="flex gap-2 items-center">
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="showAllContainers" class="checkbox checkbox-sm" onchange="loadDockerContainers()">
                Show stopped
            </label>
            <button class="btn btn-sm btn-primary" onclick="loadDockerContainers()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Refresh
            </button>
        </div>
    </div>

    <!-- Server host notice -->
    <div class="alert alert-info mb-4 py-2 text-sm" id="hostNotice">
        Links use host: <code id="hostDisplay" class="font-mono font-bold">detecting…</code>
        <button class="btn btn-xs ml-2" onclick="openServerSettings()">Change</button>
    </div>

    <!-- Stats bar -->
    <div class="flex gap-4 mb-5 flex-wrap" id="dockerStats"></div>

    <!-- Container cards -->
    <div id="dockerContainers" class="space-y-3">
        <div class="flex justify-center py-10">
            <span class="loading loading-spinner loading-lg"></span>
        </div>
    </div>

</div>
<script src="docker.js"></script>
</body>
</html>
