<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="toastContainer" class="toast toast-end z-[10000]" role="alert" aria-live="polite"></div>
<div id="loadingOverlay" class="loading-overlay" role="status" aria-label="Loading">
    <div class="flex flex-col items-center gap-4">
        <span class="loading loading-spinner loading-lg"></span>
        <span class="text-sm uppercase tracking-widest" id="loadingText">Loading...</span>
    </div>
</div>

<div id="nav-placeholder" data-active="home"></div>

<!-- ===== DASHBOARD ===== -->

<!-- Page header -->
<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div>
        <h1 id="dashGreeting" class="text-2xl font-bold tracking-tight">Dashboard</h1>
        <p id="dashDate" class="text-sm opacity-40 mt-0.5"></p>
    </div>
    <div class="flex items-center gap-2">
        <div class="badge badge-success gap-1.5 py-2.5 px-3">
            <span class="w-1.5 h-1.5 rounded-full bg-success-content inline-block animate-pulse"></span>
            Live
        </div>
        <div class="tooltip tooltip-left" data-tip="Refresh">
            <button onclick="loadDashboard()" class="btn btn-ghost btn-sm btn-square opacity-40 hover:opacity-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </button>
        </div>
        <button onclick="togglePrivacy()" class="btn btn-ghost btn-sm btn-square opacity-40 hover:opacity-100" title="Toggle privacy">
            <svg id="privacyEyeOn" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg id="privacyEyeOff" class="hidden w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
        </button>
    </div>
</div>

<!-- KPI row -->
<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="statsRow">
    <div class="card bg-base-200 shadow-sm"><div class="card-body p-4 gap-3"><div class="skeleton h-3 w-20"></div><div class="skeleton h-7 w-28"></div></div></div>
    <div class="card bg-base-200 shadow-sm"><div class="card-body p-4 gap-3"><div class="skeleton h-3 w-20"></div><div class="skeleton h-7 w-28"></div></div></div>
    <div class="card bg-base-200 shadow-sm"><div class="card-body p-4 gap-3"><div class="skeleton h-3 w-20"></div><div class="skeleton h-7 w-28"></div></div></div>
    <div class="card bg-base-200 shadow-sm"><div class="card-body p-4 gap-3"><div class="skeleton h-3 w-20"></div><div class="skeleton h-7 w-28"></div></div></div>
</div>

<!-- Main grid: 2 wide + 1 narrow -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

    <!-- LEFT: Finance (spans 2 cols) -->
    <div class="lg:col-span-2 flex flex-col gap-4">

        <!-- Bank accounts -->
        <div class="card bg-base-200 shadow-sm">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">Bank Accounts</h2>
                    <a href="/finance.html?tab=accounts" class="btn btn-ghost btn-xs opacity-50 hover:opacity-100">View →</a>
                </div>
                <div id="bankBody">
                    <div class="space-y-3">
                        <div class="skeleton h-2 w-full rounded-full"></div>
                        <div class="skeleton h-2 w-5/6 rounded-full"></div>
                        <div class="skeleton h-2 w-3/4 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- This month's budget -->
        <div class="card bg-base-200 shadow-sm">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">This Month's Budget</h2>
                    <a href="/finance.html?tab=budget" class="btn btn-ghost btn-xs opacity-50 hover:opacity-100">View →</a>
                </div>
                <div id="budgetBody">
                    <div class="space-y-3">
                        <div class="skeleton h-2 w-full rounded-full"></div>
                        <div class="skeleton h-2 w-full rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- RIGHT: Investments + Fitness + Goal (1 col) -->
    <div class="flex flex-col gap-4">

        <!-- Investments snapshot -->
        <div class="card bg-base-200 shadow-sm">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">Portfolio</h2>
                    <a href="/investments.html" class="btn btn-ghost btn-xs opacity-50 hover:opacity-100">View →</a>
                </div>
                <div id="investBody">
                    <div class="skeleton h-6 w-32 mb-3"></div>
                    <div class="skeleton h-2 w-full rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Fitness snapshot -->
        <div class="card bg-base-200 shadow-sm">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">Fitness</h2>
                    <a href="/fitness.html" class="btn btn-ghost btn-xs opacity-50 hover:opacity-100">View →</a>
                </div>
                <div id="fitnessBody">
                    <div class="skeleton h-6 w-24 mb-2"></div>
                    <div class="skeleton h-3 w-36"></div>
                </div>
            </div>
        </div>

        <!-- INR/EUR Rate -->
        <div class="card bg-base-200 shadow-sm">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">INR → EUR</h2>
                    <span id="fxCurrentRate" class="text-xs font-mono opacity-60">—</span>
                </div>
                <canvas id="fxChart" height="80"></canvas>
            </div>
        </div>

        <!-- Currently Reading -->
        <div class="card bg-base-200 shadow-sm" id="pdfCard" style="display:none">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">Currently Reading</h2>
                    <a href="/pdfs.html" class="btn btn-ghost btn-xs opacity-50 hover:opacity-100">Library →</a>
                </div>
                <div id="pdfBody"></div>
            </div>
        </div>

        <!-- FIRE goal -->
        <div class="card bg-base-200 shadow-sm" id="goalCard" style="display:none">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">FIRE Goal</h2>
                    <a href="/finance.html?tab=budget" class="btn btn-ghost btn-xs opacity-50 hover:opacity-100">View →</a>
                </div>
                <div id="goalBody"></div>
            </div>
        </div>

        <!-- Savings Goals -->
        <div class="card bg-base-200 shadow-sm" id="savingsGoalsCard" style="display:none">
            <div class="card-body p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50">Savings Goals</h2>
                    <a href="/finance.html?tab=accounts" class="btn btn-ghost btn-xs opacity-50 hover:opacity-100">View →</a>
                </div>
                <div id="savingsGoalsBody"></div>
            </div>
        </div>

    </div>
</div>

<!-- ===== END DASHBOARD ===== -->

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="shared.js"></script>
<script src="nav.js"></script>
<script src="router.js"></script>
<script>
/* ---- Greeting + date ---- */
(function () {
    const h = new Date().getHours();
    const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    const userName = localStorage.getItem('userName') || '';
    document.getElementById('dashGreeting').textContent = greet + (userName ? `, ${userName}` : '');
    document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
})();

/* ---- Formatters ---- */
function fmtEur(n, decimals = 0) {
    if (n == null || isNaN(Number(n))) return '—';
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: decimals }).format(Number(n));
}
function fmtPct(n, decimals = 1) {
    if (n == null || isNaN(Number(n))) return '—';
    return (Number(n) >= 0 ? '+' : '') + Number(n).toFixed(decimals) + '%';
}
function signClass(n) { return Number(n) >= 0 ? 'text-success' : 'text-error'; }

/* ---- KPI card ---- */
function kpiCard(label, value, sub, borderColor, subClass = '') {
    return `
    <div class="card bg-base-200 shadow-sm border-t-2 ${borderColor}">
        <div class="card-body p-4 gap-0.5">
            <div class="text-xs font-semibold uppercase tracking-widest opacity-40 mb-1">${label}</div>
            <div class="text-2xl font-bold tabular-nums">${value}</div>
            ${sub ? `<div class="text-xs mt-1 ${subClass || 'opacity-40'}">${sub}</div>` : ''}
        </div>
    </div>`;
}

/* ---- Progress bar ---- */
function progressBar(label, value, max, color = 'bg-primary') {
    const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
    return `
    <div class="mb-4 last:mb-0">
        <div class="flex justify-between items-center mb-1.5">
            <span class="text-sm opacity-60">${label}</span>
            <span class="text-sm font-semibold tabular-nums">${fmtEur(value)}</span>
        </div>
        <div class="h-1.5 bg-base-300 rounded-full overflow-hidden">
            <div class="h-full ${color} rounded-full transition-all duration-700" style="width:${pct.toFixed(1)}%"></div>
        </div>
    </div>`;
}

/* ---- FX chart ---- */
async function loadFxChart() {
    try {
        const res = await authFetch(`${API}/api/fx/history?from=INR&to=EUR&days=30`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data || data.length === 0) return;

        const labels = data.map(d => {
            const dt = new Date(d.fetchedAt);
            return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        });
        const rates = data.map(d => d.rate);

        const latest = rates[rates.length - 1];
        document.getElementById('fxCurrentRate').textContent =
            latest != null ? latest.toFixed(6) + ' EUR' : '—';

        if (typeof Chart === 'undefined') return;
        if (window._fxChart) { window._fxChart.destroy(); window._fxChart = null; }

        const primaryColor = getComputedStyle(document.documentElement)
            .getPropertyValue('--color-primary').trim() || '#6366f1';

        window._fxChart = new Chart(document.getElementById('fxChart'), {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    data: rates,
                    borderColor: primaryColor,
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.4,
                }]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: ctx => ctx.parsed.y.toFixed(6) + ' EUR'
                        }
                    }
                },
                scales: {
                    x: { display: false },
                    y: {
                        display: false,
                        grace: '5%',
                    }
                }
            }
        });
    } catch (e) {
        // silently ignore — chart is non-critical
    }
}

/* ---- Main loader ---- */
async function loadDashboard() {
    const [summaryRes, dashRes, pdfRes] = await Promise.allSettled([
        authFetch('/api/finance/summary'),
        authFetch('/api/dashboard'),
        authFetch('/api/pdfs')
    ]);

    let summary = null, dash = null, pdfs = [];
    if (summaryRes.status === 'fulfilled' && summaryRes.value.ok) summary = await summaryRes.value.json();
    if (dashRes.status === 'fulfilled'    && dashRes.value.ok)    dash    = await dashRes.value.json();
    if (pdfRes.status === 'fulfilled'     && pdfRes.value.ok)     pdfs    = await pdfRes.value.json();

    /* ---- KPI row ---- */
    const netWorth   = dash?.netWorth        ?? summary?.totalBalance ?? null;
    const savings    = dash?.budgetSavings   ?? null;
    const income     = dash?.budgetIncome    ?? 0;
    const savRate    = income > 0 && savings != null ? (savings / income * 100) : null;
    const portReturn = dash?.portfolioReturn ?? null;
    const subMonthly = dash?.subscriptionMonthly ?? null;

    document.getElementById('statsRow').innerHTML = [
        kpiCard('Net Worth',        fmtEur(netWorth),
                dash?.totalCash != null ? `Cash ${fmtEur(dash.totalCash)}` : null,
                'border-primary'),
        kpiCard('Savings Rate',
                savRate != null ? savRate.toFixed(1) + '%' : '—',
                savings != null ? `${fmtEur(savings)} saved` : null,
                'border-success',
                savRate != null ? (savRate >= 0 ? 'text-success opacity-60' : 'text-error opacity-60') : ''),
        kpiCard('Portfolio Return', fmtPct(portReturn),
                dash?.portfolioValue != null ? fmtEur(dash.portfolioValue) : null,
                'border-warning',
                portReturn != null ? signClass(portReturn) + ' opacity-80 font-semibold' : ''),
        kpiCard('Subscriptions',
                subMonthly != null ? fmtEur(subMonthly) + '/mo' : '—',
                dash?.subscriptionCount != null ? `${dash.subscriptionCount} active` : null,
                'border-violet-500/60'),
    ].join('');

    /* ---- Bank accounts ---- */
    if (summary) {
        const total   = summary.totalBalance ?? 0;
        const byBank  = summary.totalByBank  || {};
        const entries = Object.entries(byBank).sort((a, b) => b[1] - a[1]);
        document.getElementById('bankBody').innerHTML = `
            <div class="flex items-baseline gap-2 mb-5">
                <span class="text-2xl font-bold tabular-nums">${fmtEur(total)}</span>
                <span class="text-xs opacity-30">total</span>
            </div>
            ${entries.map(([bank, amt]) => progressBar(bank, amt, total)).join('')}
            ${entries.length === 0 ? '<p class="text-sm opacity-30 text-center py-4">No accounts</p>' : ''}
        `;
    } else {
        document.getElementById('bankBody').innerHTML = '<p class="text-sm opacity-30">Could not load</p>';
    }

    /* ---- Budget ---- */
    if (dash) {
        const income   = dash.budgetIncome   ?? 0;
        const expenses = dash.budgetExpenses ?? 0;
        const savings2 = dash.budgetSavings  ?? (income - expenses);
        const savRate  = income > 0 ? (savings2 / income * 100) : 0;
        const adherence = dash.budgetAdherence ?? null;

        document.getElementById('budgetBody').innerHTML = `
            <div class="grid grid-cols-3 gap-3 mb-5">
                <div class="bg-base-300 rounded-xl p-3 text-center">
                    <div class="text-xs opacity-40 mb-1">Income</div>
                    <div class="text-base font-bold text-success tabular-nums">${fmtEur(income)}</div>
                </div>
                <div class="bg-base-300 rounded-xl p-3 text-center">
                    <div class="text-xs opacity-40 mb-1">Expenses</div>
                    <div class="text-base font-bold text-error tabular-nums">${fmtEur(expenses)}</div>
                </div>
                <div class="bg-base-300 rounded-xl p-3 text-center">
                    <div class="text-xs opacity-40 mb-1">Saved</div>
                    <div class="text-base font-bold tabular-nums ${savings2 >= 0 ? 'text-success' : 'text-error'}">${fmtEur(savings2)}</div>
                </div>
            </div>
            <div class="mb-3">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-xs opacity-50">Expenses vs Income</span>
                    <span class="text-xs opacity-50">${savRate.toFixed(0)}% saved</span>
                </div>
                <div class="h-2 bg-base-300 rounded-full overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-700 ${expenses > income ? 'bg-error' : 'bg-primary'}"
                         style="width:${Math.min(100, income > 0 ? expenses / income * 100 : 0).toFixed(1)}%"></div>
                </div>
            </div>
            ${adherence != null ? `
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs opacity-40">Budget adherence</span>
                <span class="badge badge-sm ${adherence >= 80 ? 'badge-success' : adherence >= 60 ? 'badge-warning' : 'badge-error'}">${adherence.toFixed(0)}%</span>
            </div>` : ''}
            ${dash.subscriptionMonthly > 0 ? `
            <div class="flex justify-between items-center">
                <span class="text-xs opacity-40">Subscriptions</span>
                <span class="text-xs font-semibold tabular-nums">${fmtEur(dash.subscriptionMonthly)}/mo <span class="opacity-40">(${dash.subscriptionCount} active)</span></span>
            </div>` : ''}
        `;
    } else {
        document.getElementById('budgetBody').innerHTML = '<p class="text-sm opacity-30">No budget data</p>';
    }

    /* ---- Portfolio ---- */
    if (dash?.portfolioValue != null) {
        const val      = dash.portfolioValue;
        const invested = dash.portfolioInvested ?? 0;
        const ret      = dash.portfolioReturn   ?? 0;
        const pnl      = val - invested;
        document.getElementById('investBody').innerHTML = `
            <div class="text-2xl font-bold tabular-nums mb-1">${fmtEur(val)}</div>
            <div class="text-xs opacity-40 mb-4">market value</div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-base-300 rounded-xl p-2.5">
                    <div class="text-xs opacity-40 mb-1">Invested</div>
                    <div class="text-sm font-semibold tabular-nums">${fmtEur(invested)}</div>
                </div>
                <div class="bg-base-300 rounded-xl p-2.5">
                    <div class="text-xs opacity-40 mb-1">P&amp;L</div>
                    <div class="text-sm font-semibold tabular-nums ${signClass(pnl)}">${fmtEur(pnl)} <span class="text-xs">(${fmtPct(ret)})</span></div>
                </div>
            </div>
        `;
    } else {
        document.getElementById('investBody').innerHTML = '<p class="text-sm opacity-30">No holdings</p>';
    }

    /* ---- Fitness ---- */
    if (dash) {
        const streak2  = dash.fitnessCurrentStreak ?? 0;
        const week     = dash.fitnessThisWeek      ?? 0;
        const weight   = dash.currentWeight;
        const wChange  = dash.weightChange;

        document.getElementById('fitnessBody').innerHTML = `
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div class="bg-base-300 rounded-xl p-2.5 text-center">
                    <div class="text-xl font-bold">${streak2}</div>
                    <div class="text-xs opacity-40">day streak</div>
                </div>
                <div class="bg-base-300 rounded-xl p-2.5 text-center">
                    <div class="text-xl font-bold">${week}</div>
                    <div class="text-xs opacity-40">this week</div>
                </div>
            </div>
            ${weight != null ? `
            <div class="flex items-center justify-between bg-base-300 rounded-xl px-3 py-2.5">
                <span class="text-xs opacity-40">Weight</span>
                <span class="font-semibold text-sm">${weight.toFixed(1)} kg
                    ${wChange != null ? `<span class="text-xs ml-1 ${signClass(-wChange)}">(${fmtPct(wChange, 1).replace('+','+')})</span>` : ''}
                </span>
            </div>` : ''}
        `;
    } else {
        document.getElementById('fitnessBody').innerHTML = '<p class="text-sm opacity-30">No data</p>';
    }

    /* ---- FIRE Goal ---- */
    if (dash?.goalTarget > 0) {
        document.getElementById('goalCard').style.display = '';
        const pct = Math.min(100, dash.goalProgress ?? 0);
        document.getElementById('goalBody').innerHTML = `
            <div class="flex items-baseline gap-2 mb-1">
                <span class="text-xl font-bold tabular-nums">${fmtEur(dash.goalCurrent)}</span>
                <span class="text-xs opacity-30">/ ${fmtEur(dash.goalTarget)}</span>
            </div>
            <div class="text-xs opacity-40 mb-3">${pct.toFixed(1)}% to target${dash.goalFireAge ? ` · FIRE at ${dash.goalFireAge}` : ''}</div>
            <div class="h-2.5 bg-base-300 rounded-full overflow-hidden">
                <div class="h-full bg-warning rounded-full transition-all duration-700" style="width:${pct.toFixed(1)}%"></div>
            </div>
        `;
    }

    /* ---- Currently Reading (PDF) ---- */
    const readPdfs = pdfs.filter(p => p.lastReadAt).sort((a, b) => new Date(b.lastReadAt) - new Date(a.lastReadAt));
    if (readPdfs.length > 0) {
        document.getElementById('pdfCard').style.display = '';
        const p   = readPdfs[0];
        const pct = p.totalPages > 0 ? Math.min(100, (p.lastPage / p.totalPages) * 100) : 0;
        const lastRead = new Date(p.lastReadAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        document.getElementById('pdfBody').innerHTML = `
            <div class="flex items-start gap-2 mb-3">
                <span class="text-2xl shrink-0">📄</span>
                <div class="min-w-0">
                    <div class="font-semibold text-sm truncate" title="${p.filename}">${p.filename}</div>
                    <div class="text-xs opacity-40 mt-0.5">${p.totalPages > 0 ? `Page ${p.lastPage} of ${p.totalPages}` : 'Not yet opened'} · ${lastRead}</div>
                </div>
            </div>
            <div class="h-1.5 bg-base-300 rounded-full overflow-hidden mb-3">
                <div class="h-full bg-primary rounded-full transition-all duration-700" style="width:${pct.toFixed(1)}%"></div>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-xs opacity-40">${pct.toFixed(0)}% complete</span>
                ${pdfs.length > 1 ? `<span class="text-xs opacity-30">+${pdfs.length - 1} more in library</span>` : ''}
            </div>
        `;
    }

    /* ---- FX Rate chart ---- */
    loadFxChart();

    /* ---- Savings Goals ---- */
    if (dash?.savingsGoalsCount > 0) {
        document.getElementById('savingsGoalsCard').style.display = '';
        const saved  = dash.savingsGoalsSaved  ?? 0;
        const target = dash.savingsGoalsTarget ?? 0;
        const pct    = target > 0 ? Math.min(100, saved / target * 100) : 0;
        const remaining = Math.max(0, target - saved);
        document.getElementById('savingsGoalsBody').innerHTML = `
            <div class="flex items-baseline gap-2 mb-1">
                <span class="text-xl font-bold tabular-nums">${fmtEur(saved)}</span>
                <span class="text-xs opacity-30">/ ${fmtEur(target)}</span>
            </div>
            <div class="text-xs opacity-40 mb-3">${pct.toFixed(1)}% across ${dash.savingsGoalsCount} goal${dash.savingsGoalsCount !== 1 ? 's' : ''}${remaining > 0 ? ` · ${fmtEur(remaining)} to go` : ''}</div>
            <div class="h-2.5 bg-base-300 rounded-full overflow-hidden">
                <div class="h-full bg-success rounded-full transition-all duration-700" style="width:${pct.toFixed(1)}%"></div>
            </div>
        `;
    }
}

(window.__pageInits = window.__pageInits || {}).home = function () {
    requireAuth();
    loadDashboard();
    initPrivacy();
};
</script>
</body>
</html>
