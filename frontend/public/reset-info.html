<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolBox — Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-100 flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-5xl mb-4">🔑</div>
      <h2 class="text-xl font-bold mb-1">Forgot your password?</h2>
      <p class="text-sm opacity-50">Enter your email and we'll send you a reset link.</p>
    </div>

    <form id="forgotForm" class="flex flex-col gap-3">
      <input id="emailInput" type="email" placeholder="your@email.com"
             class="input input-bordered w-full" required />
      <button type="submit" class="btn btn-primary w-full">Send Reset Link</button>
    </form>

    <div id="successMsg" class="hidden alert alert-success mt-4 text-sm">
      If that email is registered, a reset link has been sent. Check your inbox.
    </div>
    <div id="errorMsg" class="hidden alert alert-error mt-4 text-sm"></div>

    <div class="text-center mt-4">
      <a href="/login.html" class="text-xs opacity-40 hover:opacity-70">← Back to Sign In</a>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      const email = document.getElementById('emailInput').value.trim();
      document.getElementById('errorMsg').classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('errorMsg').textContent = data.error || 'Something went wrong.';
          document.getElementById('errorMsg').classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
          return;
        }
        document.getElementById('successMsg').textContent = data.message;
        document.getElementById('forgotForm').classList.add('hidden');
        document.getElementById('successMsg').classList.remove('hidden');
      } catch {
        document.getElementById('errorMsg').textContent = 'Something went wrong. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
