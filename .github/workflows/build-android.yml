name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── Deploy to homelab via Tailscale ──────────────────────
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to homelab
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '~/tool-box' }}
            bash update.sh

      # ── Build Android APK ────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Inject API URL
        working-directory: frontend/public
        run: sed -i "s|http://TAILSCALE_HOST:9099|${{ secrets.API_BASE_URL }}|g" config.js

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk \
             toolbox-${{ steps.version.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ToolBox ${{ steps.version.outputs.tag }}
          body: |
            Auto-built from commit ${{ github.sha }}

            **Install on Android:**
            1. Download the APK below
            2. Enable "Install unknown apps" in Android settings
            3. Open the APK to install
          files: toolbox-${{ steps.version.outputs.tag }}.apk
          make_latest: true
