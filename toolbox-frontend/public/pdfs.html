<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox — PDF Reader</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ─── PDF viewport ─────────────────────────────────── */
        #pdfViewport { overflow-y: auto; flex: 1; }
        .pdf-page-container {
            position: relative;
            margin: 0 auto 16px;
            display: block;
        }
        .pdf-page-container canvas { display: block; width: 100%; height: auto; }
        /* ─── Text layer (selectable text over canvas) ─────── */
        .textLayer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            line-height: 1;
            user-select: text;
        }
        .textLayer span, .textLayer br {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }
        .textLayer ::selection { background: rgba(59, 130, 246, 0.35); }
        body.marker-mode .textLayer,
        body.pen-mode .textLayer { pointer-events: none; user-select: none; }
        .annot-layer { position: absolute; inset: 0; pointer-events: none; }
        .annot-layer .hl-rect {
            position: absolute;
            mix-blend-mode: multiply;
            pointer-events: auto;
            cursor: default;
        }
        .annot-layer .note-icon {
            position: absolute;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        /* ─── Color picker popup ───────────────────────────── */
        #colorPicker {
            position: fixed;
            z-index: 9000;
            display: none;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #colorPicker button {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.15s;
        }
        #colorPicker button:hover { transform: scale(1.2); }
        /* ─── Note mode cursor ─────────────────────────────── */
        body.note-mode #pdfViewport { cursor: crosshair; }
        /* ─── Marker mode ──────────────────────────────────── */
        body.marker-mode #pdfViewport { cursor: crosshair; user-select: none; }
        /* ─── Pen mode ──────────────────────────────────────── */
        body.pen-mode #pdfViewport { cursor: crosshair; user-select: none; }
        .draw-layer { position: absolute; inset: 0; pointer-events: none; }
        body.pen-mode .draw-layer { pointer-events: auto; }
        /* ─── Fullscreen ────────────────────────────────────── */
        #readerView:fullscreen { height: 100vh !important; margin: 0 !important; }
        #readerView:-moz-full-screen { height: 100vh !important; margin: 0 !important; }
        /* ─── Reading progress bar ─────────────────────────── */
        .pdf-progress { height: 4px; background: oklch(var(--p)); border-radius: 2px; }
        /* ─── Upload queue panel ───────────────────────────── */
        #uploadQueue {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 8000;
            width: 340px;
            max-height: 420px;
            overflow-y: auto;
            display: none;
        }
        .upload-item-bar {
            height: 4px;
            border-radius: 2px;
            background: oklch(var(--p));
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <div id="toastContainer" class="toast toast-end z-[10000]" role="alert" aria-live="polite"></div>
    <div id="loadingOverlay" class="loading-overlay" role="status" aria-label="Loading">
        <div class="flex flex-col items-center gap-4">
            <span class="loading loading-spinner loading-lg"></span>
            <span class="text-sm uppercase tracking-widest" id="loadingText">Loading...</span>
        </div>
    </div>
    <div id="nav-placeholder" data-active="pdfs"></div>

    <!-- ══════════════════════════════════════════════════════
         LIBRARY VIEW
    ═══════════════════════════════════════════════════════ -->
    <div id="libraryView">
        <!-- Header -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">PDF Reader</h1>
                <p class="text-sm opacity-40 mt-0.5">Upload and read PDFs across all devices</p>
            </div>
            <label class="btn btn-primary btn-sm gap-2 cursor-pointer" for="pdfUploadInput">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/>
                </svg>
                Upload PDFs
            </label>
            <input id="pdfUploadInput" type="file" accept="application/pdf" multiple class="hidden" onchange="handlePdfUpload(this)">
        </div>

        <!-- Search bar -->
        <div class="relative mb-4">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 opacity-40 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            <input id="pdfSearchInput" type="search" placeholder="Search PDFs…"
                   class="input input-bordered input-sm w-full pl-9"
                   oninput="onPdfSearch(this.value)">
        </div>

        <!-- Group filter tabs -->
        <div id="groupTabs" class="flex flex-wrap gap-2 mb-5"></div>

        <!-- Grid -->
        <div id="pdfGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- populated by JS -->
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         READER VIEW
    ═══════════════════════════════════════════════════════ -->
    <div id="readerView" class="hidden flex flex-col" style="height: calc(100vh - 56px); margin: -24px;">

        <!-- Sticky toolbar -->
        <div class="navbar bg-base-200 border-b border-base-300 px-3 gap-2 min-h-[48px] shrink-0 flex-wrap">
            <button class="btn btn-ghost btn-sm btn-square" onclick="closeReader()" title="Back to library">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
                </svg>
            </button>
            <span id="readerTitle" class="text-sm font-medium truncate max-w-[140px] sm:max-w-xs opacity-70"></span>
            <div class="flex-1"></div>
            <div class="flex items-center gap-1">
                <button class="btn btn-ghost btn-xs btn-square" onclick="readerPageStep(-1)">‹</button>
                <input id="pageInput" type="number" min="1" class="input input-bordered input-xs w-14 text-center" onchange="readerGoToPage(this.value)">
                <span class="text-xs opacity-50">/ <span id="totalPagesLabel">—</span></span>
                <button class="btn btn-ghost btn-xs btn-square" onclick="readerPageStep(1)">›</button>
            </div>
            <div class="flex items-center gap-1">
                <button class="btn btn-ghost btn-xs" onclick="readerZoom(-0.25)">−</button>
                <span id="zoomLabel" class="text-xs opacity-50 w-10 text-center">150%</span>
                <button class="btn btn-ghost btn-xs" onclick="readerZoom(+0.25)">+</button>
            </div>
            <button id="addNoteBtn" class="btn btn-ghost btn-xs gap-1" onclick="startNoteMode()">
                <span>📝</span><span class="hidden sm:inline">Note</span>
            </button>
            <!-- Marker tool -->
            <div class="relative">
                <button id="markerBtn" class="btn btn-ghost btn-xs gap-1" onclick="toggleMarkerPicker()" title="Marker highlight">
                    <span>🖊️</span><span class="hidden sm:inline">Marker</span>
                </button>
                <div id="markerColorRow" class="hidden absolute top-full left-0 mt-1 flex gap-1.5 p-2 bg-base-100 border border-base-300 rounded-lg shadow-xl z-[9999]">
                    <button style="background:#facc15" class="w-5 h-5 rounded-full border-2 border-transparent hover:scale-110 transition-transform" onclick="activateMarker('yellow')" title="Yellow"></button>
                    <button style="background:#4ade80" class="w-5 h-5 rounded-full border-2 border-transparent hover:scale-110 transition-transform" onclick="activateMarker('green')" title="Green"></button>
                    <button style="background:#f472b6" class="w-5 h-5 rounded-full border-2 border-transparent hover:scale-110 transition-transform" onclick="activateMarker('pink')" title="Pink"></button>
                </div>
            </div>
            <!-- Pen tool -->
            <div class="relative">
                <button id="penBtn" class="btn btn-ghost btn-xs gap-1" onclick="togglePenPicker()" title="Freehand pen">
                    <span>✏️</span><span class="hidden sm:inline">Pen</span>
                </button>
                <div id="penColorRow" class="hidden absolute top-full left-0 mt-1 flex gap-1.5 p-2 bg-base-100 border border-base-300 rounded-lg shadow-xl z-[9999]">
                    <button style="background:#1e1e1e" class="w-5 h-5 rounded-full border-2 border-transparent hover:scale-110 transition-transform" onclick="activatePen('#1e1e1e')" title="Black"></button>
                    <button style="background:#2563eb" class="w-5 h-5 rounded-full border-2 border-transparent hover:scale-110 transition-transform" onclick="activatePen('#2563eb')" title="Blue"></button>
                    <button style="background:#ef4444" class="w-5 h-5 rounded-full border-2 border-transparent hover:scale-110 transition-transform" onclick="activatePen('#ef4444')" title="Red"></button>
                    <button style="background:#16a34a" class="w-5 h-5 rounded-full border-2 border-transparent hover:scale-110 transition-transform" onclick="activatePen('#16a34a')" title="Green"></button>
                </div>
            </div>
            <!-- Undo -->
            <button class="btn btn-ghost btn-xs" onclick="undoLastAnnotation()" title="Undo last (Ctrl+Z)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/>
                </svg>
            </button>
            <button class="btn btn-ghost btn-xs gap-1" onclick="downloadCurrentPdf()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                </svg>
                <span class="hidden sm:inline">Download</span>
            </button>
            <button id="fullscreenBtn" class="btn btn-ghost btn-xs" onclick="toggleFullscreen()" title="Fullscreen">
                <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/>
                </svg>
            </button>
            <button class="btn btn-ghost btn-xs hidden lg:flex" onclick="toggleAnnotSidebar()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
                </svg>
            </button>
        </div>

        <!-- Reader body -->
        <div class="flex flex-1 overflow-hidden">
            <div id="pdfViewport" class="flex-1 overflow-y-auto p-4 bg-base-300"></div>
            <aside id="annotSidebar" class="hidden lg:flex flex-col w-72 shrink-0 border-l border-base-300 bg-base-100 overflow-y-auto">
                <div class="p-3 border-b border-base-300 text-xs font-semibold uppercase tracking-widest opacity-50">Annotations</div>
                <div id="annotSidebarList" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2"></div>
            </aside>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         UPLOAD QUEUE PANEL (fixed, bottom-right)
    ═══════════════════════════════════════════════════════ -->
    <div id="uploadQueue" class="card bg-base-100 border border-base-300 shadow-2xl">
        <div class="card-body p-4 gap-3">
            <div class="flex items-center justify-between">
                <span class="text-sm font-semibold" id="uploadQueueTitle">Uploading…</span>
                <button class="btn btn-ghost btn-xs btn-square" onclick="dismissUploadQueue()" id="uploadQueueClose" style="display:none">✕</button>
            </div>

            <!-- Group assignment for this batch -->
            <div class="flex items-center gap-2">
                <span class="text-xs opacity-50 shrink-0">Group:</span>
                <input id="uploadGroupInput" type="text" placeholder="e.g. Fiction (optional)"
                       list="groupSuggestions"
                       class="input input-bordered input-xs flex-1" />
                <datalist id="groupSuggestions"></datalist>
            </div>

            <!-- File list -->
            <div id="uploadQueueList" class="flex flex-col gap-2.5"></div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         COLOR PICKER POPUP
    ═══════════════════════════════════════════════════════ -->
    <div id="colorPicker" class="bg-base-100 border border-base-300 flex">
        <button style="background:#facc15;" title="Yellow" onclick="saveHighlight('yellow')"></button>
        <button style="background:#4ade80;" title="Green"  onclick="saveHighlight('green')"></button>
        <button style="background:#f472b6;" title="Pink"   onclick="saveHighlight('pink')"></button>
        <button class="btn btn-ghost btn-xs ml-1" onclick="hideColorPicker()">✕</button>
    </div>

    <!-- ══════════════════════════════════════════════════════
         NOTE INPUT MODAL
    ═══════════════════════════════════════════════════════ -->
    <dialog id="noteInputModal" class="modal">
        <div class="modal-box max-w-sm">
            <h3 class="font-bold text-sm uppercase tracking-widest mb-3">Add Note</h3>
            <textarea id="noteTextInput" class="textarea textarea-bordered w-full h-28 text-sm" placeholder="Type your note…"></textarea>
            <div class="modal-action mt-3">
                <button class="btn btn-ghost btn-sm" onclick="closeModal('noteInputModal'); cancelNoteMode()">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="confirmNote()">Save</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- ══════════════════════════════════════════════════════
         NOTE VIEW MODAL
    ═══════════════════════════════════════════════════════ -->
    <dialog id="noteViewModal" class="modal">
        <div class="modal-box max-w-sm">
            <h3 class="font-bold text-sm uppercase tracking-widest mb-3">Note — Page <span id="noteViewPage"></span></h3>
            <p id="noteViewText" class="text-sm whitespace-pre-wrap min-h-[48px]"></p>
            <div class="modal-action mt-3">
                <button class="btn btn-error btn-sm" onclick="deleteCurrentNote()">Delete</button>
                <button class="btn btn-ghost btn-sm" onclick="closeModal('noteViewModal')">Close</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- ══════════════════════════════════════════════════════
         ANNOTATION DELETE BUBBLE
    ═══════════════════════════════════════════════════════ -->
    <div id="annotDeleteBubble" class="hidden fixed z-[9600] flex items-center gap-1 bg-base-100 border border-base-300 rounded-lg shadow-xl px-2 py-1.5">
        <span class="text-xs opacity-50" id="annotDeleteLabel">Annotation</span>
        <button class="btn btn-error btn-xs btn-square" onclick="deleteFromBubble()" title="Delete">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
            </svg>
        </button>
        <button class="btn btn-ghost btn-xs btn-square" onclick="hideAnnotDeleteBubble()">✕</button>
    </div>

    <!-- Scripts -->
    <script src="shared.js"></script>
    <script src="nav.js"></script>
    <script src="pdfs.js"></script>
</body>
</html>
