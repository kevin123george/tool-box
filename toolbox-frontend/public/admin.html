<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox - Users</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="toastContainer" class="toast toast-end z-[10000]" role="alert" aria-live="polite"></div>

<div id="loadingOverlay" class="loading-overlay" role="status" aria-label="Loading">
    <div class="flex flex-col items-center gap-4">
        <span class="loading loading-spinner loading-lg"></span>
        <span class="text-sm uppercase tracking-widest" id="loadingText">Loading...</span>
    </div>
</div>

<div id="nav-placeholder" data-active="admin"></div>

<div class="flex items-center justify-between mb-6">
    <div>
        <h1 class="text-2xl font-bold tracking-tight">Users</h1>
        <p class="text-sm opacity-40 mt-0.5">Manage accounts and roles</p>
    </div>
    <button class="btn btn-ghost btn-sm gap-2" onclick="loadUsers()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/>
        </svg>
        Refresh
    </button>
</div>

<div id="usersContent">
    <div class="flex items-center gap-3 p-10 opacity-40">
        <span class="loading loading-spinner loading-sm"></span>
        <span class="text-sm">Loading users...</span>
    </div>
</div>

<!-- Delete confirm modal -->
<dialog id="deleteModal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg">Delete user?</h3>
        <p class="py-3 opacity-70 text-sm">This will permanently remove the account. This action cannot be undone.</p>
        <p class="font-semibold" id="deleteModalName"></p>
        <div class="modal-action">
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('deleteModal').close()">Cancel</button>
            <button class="btn btn-error btn-sm" id="deleteConfirmBtn" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script src="shared.js"></script>
<script src="nav.js"></script>
<script src="admin.js"></script>
</body>
</html>
