<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="toastContainer" class="toast toast-end z-[10000]" role="alert" aria-live="polite"></div>
<div id="loadingOverlay" class="loading-overlay" role="status" aria-label="Loading">
    <div class="flex flex-col items-center gap-4">
        <span class="loading loading-spinner loading-lg"></span>
        <span class="text-sm uppercase tracking-widest" id="loadingText">Loading...</span>
    </div>
</div>

<div id="nav-placeholder" data-active="home"></div>

<!-- ===== DASHBOARD ===== -->

<!-- Page header -->
<div class="flex flex-wrap items-center justify-between gap-3 mb-8">
    <div>
        <h1 id="dashGreeting" class="text-2xl font-bold tracking-tight">Dashboard</h1>
        <p id="dashDate" class="text-sm opacity-40 mt-0.5"></p>
    </div>
    <div class="flex items-center gap-2">
        <div class="badge badge-success gap-1.5 py-2.5 px-3">
            <span class="w-1.5 h-1.5 rounded-full bg-success-content inline-block animate-pulse"></span>
            Live
        </div>
        <div class="tooltip tooltip-left" data-tip="Refresh">
            <button onclick="loadDashboard()" class="btn btn-ghost btn-sm btn-square opacity-40 hover:opacity-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- KPI row -->
<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="statsRow">
    <div class="card bg-base-200 shadow-sm">
        <div class="card-body p-4 gap-3">
            <div class="skeleton h-3 w-24"></div>
            <div class="skeleton h-7 w-32"></div>
        </div>
    </div>
    <div class="card bg-base-200 shadow-sm">
        <div class="card-body p-4 gap-3">
            <div class="skeleton h-3 w-24"></div>
            <div class="skeleton h-7 w-32"></div>
        </div>
    </div>
    <div class="card bg-base-200 shadow-sm">
        <div class="card-body p-4 gap-3">
            <div class="skeleton h-3 w-24"></div>
            <div class="skeleton h-7 w-32"></div>
        </div>
    </div>
    <div class="card bg-base-200 shadow-sm">
        <div class="card-body p-4 gap-3">
            <div class="skeleton h-3 w-24"></div>
            <div class="skeleton h-7 w-32"></div>
        </div>
    </div>
</div>

<!-- Main content row -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">

    <!-- Finance breakdown — 2 cols -->
    <div class="lg:col-span-2 card bg-base-200 shadow-sm">
        <div class="card-body p-5">
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h2 class="font-semibold text-sm uppercase tracking-widest opacity-60">Finance Breakdown</h2>
                </div>
                <a href="/finance.html" class="btn btn-ghost btn-xs gap-1 opacity-50 hover:opacity-100">
                    View all
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </a>
            </div>
            <div id="financeSummaryBody">
                <div class="space-y-3">
                    <div class="h-3 bg-base-300 rounded animate-pulse w-2/3"></div>
                    <div class="h-2 bg-base-300 rounded animate-pulse w-full"></div>
                    <div class="h-2 bg-base-300 rounded animate-pulse w-5/6"></div>
                    <div class="h-2 bg-base-300 rounded animate-pulse w-3/4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sections sidebar card — 1 col -->
    <div class="card bg-base-200 shadow-sm">
        <div class="card-body p-5">
            <h2 class="font-semibold text-sm uppercase tracking-widest opacity-60 mb-4">Navigate</h2>
            <nav class="flex flex-col gap-0.5" id="sectionLinks"></nav>
        </div>
    </div>

</div>

<!-- Module cards grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="moduleCards"></div>

<!-- ===== END DASHBOARD ===== -->

<script src="shared.js"></script>
<script src="nav.js"></script>
<script>
/* ---- Greeting + date ---- */
(function () {
    const h = new Date().getHours();
    const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    const userName = localStorage.getItem('userName') || '';
    document.getElementById('dashGreeting').textContent = greet + (userName ? `, ${userName}` : '');
    document.getElementById('dashDate').textContent = new Date().toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
})();

/* ---- Formatters ---- */
function fmtEur(n) {
    if (n == null || isNaN(Number(n))) return '—';
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Number(n));
}

/* ---- SVG icons for dashboard ---- */
const DASH_ICONS = {
    finance:     `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z"/></svg>`,
    investments: `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941"/></svg>`,
    memos:       `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>`,
    fitness:     `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg>`,
    system:      `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>`,
    wallet:      `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 0 0-2.25-2.25H15a3 3 0 1 1-6 0H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 9m18 0V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v3"/></svg>`,
    building:    `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75Z"/></svg>`,
    chartBar:    `<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>`,
    arrowRight:  `<svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>`
};

/* ---- Section nav links ---- */
const SECTIONS = [
    { label: 'Finance',     href: '/finance.html',     icon: 'finance',     color: 'text-blue-500' },
    { label: 'Investments', href: '/investments.html',  icon: 'investments', color: 'text-emerald-500' },
    { label: 'Memos',       href: '/memos.html',       icon: 'memos',       color: 'text-amber-500' },
    { label: 'Fitness',     href: '/fitness.html',     icon: 'fitness',     color: 'text-rose-500' },
    { label: 'System',      href: '/system.html',      icon: 'system',      color: 'text-violet-500' },
];
document.getElementById('sectionLinks').innerHTML = SECTIONS.map(s => `
    <a href="${s.href}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-base-300 transition-colors group">
        <span class="${s.color} opacity-70 group-hover:opacity-100 transition-opacity">${DASH_ICONS[s.icon]}</span>
        <span class="text-sm font-medium flex-1">${s.label}</span>
        <span class="opacity-0 group-hover:opacity-35 transition-opacity">${DASH_ICONS.arrowRight}</span>
    </a>
`).join('');

/* ---- Module cards ---- */
const MODULES = [
    { label: 'Finance',     sub: 'Accounts, budget, subscriptions & analytics', href: '/finance.html',     icon: 'finance',     from: 'from-blue-500/15',    to: 'to-blue-500/5',    ring: 'border-blue-500/20',    ic: 'text-blue-500' },
    { label: 'Investments', sub: 'Stocks, history, DCF, research & screener',   href: '/investments.html',  icon: 'investments', from: 'from-emerald-500/15', to: 'to-emerald-500/5', ring: 'border-emerald-500/20', ic: 'text-emerald-500' },
    { label: 'Memos',       sub: 'Rich text notes, categories & search',        href: '/memos.html',       icon: 'memos',       from: 'from-amber-500/15',   to: 'to-amber-500/5',   ring: 'border-amber-500/20',   ic: 'text-amber-500' },
    { label: 'Fitness',     sub: 'Workouts, weight tracking & weekly plans',    href: '/fitness.html',     icon: 'fitness',     from: 'from-rose-500/15',    to: 'to-rose-500/5',    ring: 'border-rose-500/20',    ic: 'text-rose-500' },
    { label: 'System',      sub: 'CPU, memory, disk & push notifications',      href: '/system.html',      icon: 'system',      from: 'from-violet-500/15',  to: 'to-violet-500/5',  ring: 'border-violet-500/20',  ic: 'text-violet-500' },
];
document.getElementById('moduleCards').innerHTML = MODULES.map(m => `
    <a href="${m.href}" class="card bg-base-200 border border-base-300 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 group cursor-pointer">
        <div class="card-body p-5">
            <div class="flex items-start justify-between mb-4">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br ${m.from} ${m.to} border ${m.ring} flex items-center justify-center ${m.ic} shadow-sm">
                    ${DASH_ICONS[m.icon]}
                </div>
                <span class="opacity-0 group-hover:opacity-30 transition-opacity mt-1">${DASH_ICONS.arrowRight}</span>
            </div>
            <p class="font-semibold text-base mb-1">${m.label}</p>
            <p class="text-xs opacity-40 leading-relaxed">${m.sub}</p>
        </div>
    </a>
`).join('');

/* ---- KPI card builder ---- */
function kpiCard(iconKey, label, value, borderColor) {
    return `
    <div class="card bg-base-200 shadow-sm border-t-2 ${borderColor} overflow-hidden">
        <div class="card-body p-5 gap-1">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold uppercase tracking-widest opacity-40">${label}</span>
                <span class="opacity-30">${DASH_ICONS[iconKey]}</span>
            </div>
            <div class="text-2xl font-bold tabular-nums">${value}</div>
        </div>
    </div>`;
}

/* ---- Progress bar row ---- */
function financeBar(label, amount, total) {
    const pct = total > 0 ? Math.min(100, (amount / total) * 100) : 0;
    return `
    <div class="mb-4">
        <div class="flex justify-between items-center mb-1.5">
            <span class="text-sm opacity-70">${label}</span>
            <span class="text-sm font-semibold tabular-nums">${fmtEur(amount)}</span>
        </div>
        <div class="h-1.5 bg-base-300 rounded-full overflow-hidden">
            <div class="h-full bg-primary rounded-full transition-all duration-700 ease-out" style="width:${pct.toFixed(1)}%"></div>
        </div>
        <div class="text-xs opacity-30 mt-1">${pct.toFixed(1)}%</div>
    </div>`;
}

/* ---- Dashboard loader ---- */
async function loadDashboard() {
    const stats = { balance: '—', accounts: '—', netWorth: '—', portfolio: '—' };

    try {
        const r = await authFetch('/api/finance/summary');
        if (r.ok) {
            const d = await r.json();
            const total = d.totalBalance ?? d.total ?? 0;
            stats.balance  = fmtEur(total);
            stats.accounts = String(d.accounts?.length ?? d.count ?? '—');

            const byBank = d.totalByBank || d.byBank || {};
            const entries = Object.entries(byBank).sort((a, b) => b[1] - a[1]);
            document.getElementById('financeSummaryBody').innerHTML = `
                <div class="flex items-baseline gap-2 mb-6">
                    <span class="text-3xl font-bold tabular-nums">${fmtEur(total)}</span>
                    <span class="text-xs opacity-30 font-medium">total balance</span>
                </div>
                ${entries.map(([bank, amt]) => financeBar(bank, amt, total)).join('')}
                ${entries.length === 0 ? '<p class="text-sm opacity-30 text-center py-6">No account data</p>' : ''}
            `;
        }
    } catch (_) {}

    try {
        const r = await authFetch('/api/dashboard');
        if (r.ok) {
            const d = await r.json();
            if (d.netWorth      != null) stats.netWorth  = fmtEur(d.netWorth);
            if (d.portfolioValue != null) stats.portfolio = fmtEur(d.portfolioValue);
        }
    } catch (_) {}

    document.getElementById('statsRow').innerHTML = [
        kpiCard('wallet',      'Total Balance', stats.balance,  'border-primary'),
        kpiCard('building',    'Accounts',      stats.accounts, 'border-secondary'),
        kpiCard('chartBar',    'Net Worth',     stats.netWorth, 'border-success'),
        kpiCard('investments', 'Portfolio',     stats.portfolio,'border-warning'),
    ].join('');
}

document.addEventListener('DOMContentLoaded', function() {
    requireAuth();
    loadDashboard();
});
</script>
</body>
</html>
