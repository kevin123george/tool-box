<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToolBox — Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-100 flex items-center justify-center p-6">
  <div class="w-full max-w-sm text-center">
    <div class="text-5xl mb-5">🔑</div>
    <h2 class="text-xl font-bold mb-2">Forgot your password?</h2>
    <p class="text-sm opacity-50 mb-6 leading-relaxed">
      Password resets are handled by your admin.<br/>
      Contact them and ask for a reset link — it takes just a second from the admin panel.
    </p>
    <a href="/login.html" class="btn btn-ghost btn-sm">← Back to Sign In</a>
  </div>
</body>
</html>
