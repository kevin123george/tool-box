<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox — Memos</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toastContainer" class="toast toast-end z-[10000]" role="alert" aria-live="polite"></div>
    <div id="loadingOverlay" class="loading-overlay" role="status" aria-label="Loading">
        <div class="flex flex-col items-center gap-4"><span class="loading loading-spinner loading-lg"></span><span class="text-sm uppercase tracking-widest" id="loadingText">Loading...</span></div>
    </div>
    <div id="nav-placeholder" data-active="memos"></div>

    <!-- Page header -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Memos</h1>
            <p class="text-sm opacity-40 mt-0.5">Notes, ideas &amp; journal</p>
        </div>
        <div class="flex items-center gap-2">
            <span id="memoCountBadge" class="badge badge-neutral badge-lg font-mono">—</span>
        </div>
    </div>

    <!-- Category filter tabs -->
    <div class="flex flex-wrap gap-2 mb-6" id="memoCategoryFilter">
        <button class="btn btn-sm btn-primary" data-cat="" onclick="filterMemosByCategory(this)">All</button>
        <button class="btn btn-sm btn-ghost" data-cat="personal"  onclick="filterMemosByCategory(this)">Personal</button>
        <button class="btn btn-sm btn-ghost" data-cat="work"      onclick="filterMemosByCategory(this)">Work</button>
        <button class="btn btn-sm btn-ghost" data-cat="ideas"     onclick="filterMemosByCategory(this)">Ideas</button>
        <button class="btn btn-sm btn-ghost" data-cat="journal"   onclick="filterMemosByCategory(this)">Journal</button>
    </div>

    <!-- Main 2-col layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

        <!-- LEFT: New memo form (sticky) -->
        <div class="card bg-base-200 shadow-sm lg:sticky lg:top-[72px]">
            <div class="card-body p-5 gap-3">
                <h2 class="font-semibold text-sm uppercase tracking-widest opacity-50 mb-1">New Memo</h2>

                <input id="memoTitle" placeholder="Title" class="input input-bordered w-full">

                <div>
                    <label class="label py-0 mb-1"><span class="label-text text-xs opacity-50">Content</span></label>
                    <div id="memoContent" style="height:160px;"></div>
                </div>

                <select id="memoCategory" class="select select-bordered w-full mt-1">
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="ideas">Ideas</option>
                    <option value="journal">Journal</option>
                </select>

                <div class="flex items-center gap-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="memoPinned" class="checkbox checkbox-sm checkbox-primary">
                        <span class="text-sm">Pin to top</span>
                    </label>
                </div>

                <label class="form-control w-full">
                    <div class="label py-0 mb-1"><span class="label-text text-xs opacity-50">Attach image (optional)</span></div>
                    <input type="file" id="memoFile" accept="image/*" class="file-input file-input-bordered file-input-sm w-full">
                </label>

                <button class="btn btn-primary w-full mt-1" onclick="addMemo()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                    Add Memo
                </button>
            </div>
        </div>

        <!-- RIGHT: Memo list + pagination -->
        <div class="lg:col-span-2 flex flex-col gap-3">

            <!-- Pagination top -->
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="text-xs opacity-40" id="memoPageInfo"></div>
                <div class="flex items-center gap-2">
                    <select id="memoPageSize" class="select select-bordered select-xs w-20" onchange="memoChangePageSize()">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                    <div class="join">
                        <button class="join-item btn btn-xs btn-ghost" id="memoPrevBtn" onclick="memoPrevPage()">‹ Prev</button>
                        <span class="join-item btn btn-xs btn-disabled no-animation" id="memoTotalPagesSpan"></span>
                        <button class="join-item btn btn-xs btn-ghost" id="memoNextBtn" onclick="memoNextPage()">Next ›</button>
                    </div>
                </div>
            </div>

            <!-- Memo cards -->
            <div id="memoList" class="flex flex-col gap-3">
                <!-- populated by JS -->
            </div>

            <!-- Pagination bottom -->
            <div class="flex justify-center mt-2" id="memoPaginationBottom"></div>

        </div>
    </div>

    <!-- ===== VIEW MODAL ===== -->
    <dialog id="memoViewModal" class="modal">
        <div class="modal-box max-w-2xl">
            <div class="flex items-start justify-between mb-4">
                <div>
                    <h3 id="viewMemoTitle" class="font-bold text-xl leading-tight"></h3>
                    <div id="viewMemoMeta" class="flex items-center gap-2 mt-2"></div>
                </div>
                <button class="btn btn-ghost btn-sm btn-square" onclick="closeMemoViewModal()">✕</button>
            </div>
            <div class="divider my-2"></div>
            <div id="viewMemoContent" class="memo-content-view prose prose-sm max-w-none min-h-[80px]"></div>
            <div id="viewMemoImageWrapper" class="hidden mt-4">
                <img id="viewMemoImage" class="max-w-full rounded-xl border border-base-300">
            </div>
            <div class="modal-action mt-4">
                <button class="btn btn-ghost" onclick="closeMemoViewModal()">Close</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- ===== EDIT MODAL ===== -->
    <dialog id="memoModal" class="modal">
        <div class="modal-box max-w-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg">Edit Memo</h3>
                <button class="btn btn-ghost btn-sm btn-square" onclick="closeMemoModal()">✕</button>
            </div>
            <div class="flex flex-col gap-3">
                <input id="editMemoTitle" placeholder="Title" class="input input-bordered w-full">
                <div>
                    <label class="label py-0 mb-1"><span class="label-text text-xs opacity-50">Content</span></label>
                    <div id="editMemoContent" style="height:220px;"></div>
                </div>
                <select id="editMemoCategory" class="select select-bordered w-full mt-1">
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="ideas">Ideas</option>
                    <option value="journal">Journal</option>
                </select>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="editMemoPinned" class="checkbox checkbox-sm checkbox-primary">
                    <span class="text-sm">Pin to top</span>
                </label>
                <label class="form-control w-full">
                    <div class="label py-0 mb-1"><span class="label-text text-xs opacity-50">Replace image (optional)</span></div>
                    <input type="file" id="editMemoFile" accept="image/*" class="file-input file-input-bordered file-input-sm w-full">
                </label>
            </div>
            <div class="modal-action mt-4">
                <button class="btn btn-ghost" onclick="closeMemoModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveMemoEdit()">Save changes</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js" defer></script>
    <script src="shared.js"></script>
    <script src="nav.js"></script>
    <script src="router.js"></script>
    <script src="memos.js?v=1"></script>
</body>
</html>
