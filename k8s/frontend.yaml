apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox-frontend
  namespace: toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolbox-frontend
  template:
    metadata:
      labels:
        app: toolbox-frontend
    spec:
      containers:
        - name: frontend
          image: toolbox-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://toolbox-backend.toolbox.svc.cluster.local:9099"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: toolbox-frontend
  namespace: toolbox
spec:
  selector:
    app: toolbox-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
  type: NodePort
