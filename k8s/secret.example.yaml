# DO NOT commit real secrets. This file shows the structure only.
# The deploy-k8s.sh script creates the real secret from your .env file.
apiVersion: v1
kind: Secret
metadata:
  name: toolbox-secrets
  namespace: toolbox
type: Opaque
stringData:
  JWT_SECRET: "your-long-random-secret-here"
  KEVIN_NAME: "Admin"
  KEVIN_EMAIL: "admin@example.com"
  KEVIN_PASSWORD: "changeme"
  MONGODB_URI: "mongodb://192.168.1.X:27017/tool-box"   # host LAN or Tailscale IP
  ALPHA_VANTAGE_API_KEY: ""
  MAILERSEND_API_KEY: ""
  NOTIFICATION_FROM_EMAIL: "noreply@toolbox.local"
  NOTIFICATION_FROM_NAME: "ToolBox"
